name: SWU自动签到01

# 停用方式：仓库 Actions → 自动签到 → Disable workflow
# GitHub 官方禁用 workflow 后，定时任务和手动触发都会停止

# 沿用原设计：窗口内错峰、多轮执行；学校接口返回已签到后自动跳过。
# 不指定 schedule.timezone，以下 cron 明确使用 UTC（北京时间 = UTC + 8）。
# GitHub 可能延迟或丢弃定时任务；运行时再次检查北京时间，防止迟到至凌晨后提交。
on:
  schedule:
    - cron: '3 13 * * *'   # 北京时间 21:03，提前首轮
    - cron: '17 13 * * *'  # 北京时间 21:17
    - cron: '29 13 * * *'  # 北京时间 21:29
  workflow_dispatch:              # 允许手动触发

jobs:
  checkin:
    runs-on: ubuntu-latest
    strategy:
      # 多账号并行执行，失败不影响其他账号
      fail-fast: false
      matrix:
        account:
          - name: "账号1"
            username_secret: SWU_USERNAME
            password_secret: SWU_PASSWORD
          # 如需添加更多账号，取消下面的注释并配置对应的 Secrets
          # - name: "账号2"
          #   username_secret: SWU_USERNAME_2
          #   password_secret: SWU_PASSWORD_2
          # - name: "账号3"
          #   username_secret: SWU_USERNAME_3
          #   password_secret: SWU_PASSWORD_3
    
    name: 签到 - ${{ matrix.account.name }}
    # 同一账号串行执行，避免排队延迟导致几轮同时检查并重复提交。
    concurrency:
      group: swu-checkin-${{ github.ref }}-${{ matrix.account.name }}
      cancel-in-progress: false
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 检查定时触发窗口
        id: schedule_guard
        env:
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_CRON: ${{ github.event.schedule }}
        run: |
          echo "触发方式: $EVENT_NAME"
          echo "触发 cron (UTC): ${TRIGGER_CRON:-手动触发}"
          echo "执行时间 (北京时间): $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')"
          allowed=true
          if [ "$EVENT_NAME" = "schedule" ]; then
            case "$TRIGGER_CRON" in
              '3 13 * * *'|'17 13 * * *'|'29 13 * * *') ;;
              *) allowed=false; echo "::warning::旧定时任务已停用，跳过本次签到" ;;
            esac
            beijing_hhmm=$(TZ='Asia/Shanghai' date '+%H%M')
            if (( 10#$beijing_hhmm < 2100 || 10#$beijing_hhmm >= 2330 )); then
              allowed=false
              echo "::warning::定时任务已迟到至 21:00–23:30 签到窗口外，跳过本次签到"
            fi
          fi
          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"
          if [ "$allowed" = "false" ]; then
            echo "### ⏭️ 定时任务跳过：旧 cron 或执行时间超出北京时间 21:00–23:30" >> "$GITHUB_STEP_SUMMARY"
          fi
      
      - name: 设置 Python
        if: steps.schedule_guard.outputs.allowed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      
      - name: 安装依赖
        if: steps.schedule_guard.outputs.allowed == 'true'
        run: |
          echo "========================================="
          echo "开始安装依赖..."
          echo "========================================="
          pip install --upgrade pip
          pip install -e .
          echo ""
          echo "✅ 依赖安装完成"
          echo ""
      
      - name: 执行签到
        id: checkin
        if: steps.schedule_guard.outputs.allowed == 'true'
        env:
          SWUDK_USERNAME: ${{ secrets[matrix.account.username_secret] }}
          SWUDK_PASSWORD: ${{ secrets[matrix.account.password_secret] }}
          # 瞬时失败自动重试：总尝试 3 次，首次等待 8 秒后指数退避
          SWUDK_MAX_ATTEMPTS: "3"
          SWUDK_RETRY_DELAY: "8"
          # 只记录接口状态/耗时/异常类型，不记录查询参数、凭据、请求或响应内容。
          PYTHONPATH: ${{ github.workspace }}/.github/diagnostics
        run: |
          echo "========================================="
          echo "开始执行签到任务"
          echo "账号名称: ${{ matrix.account.name }}"
          echo "时间: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')"
          if [ -n "$SWUDK_USERNAME" ]; then
            # 短账号禁止显示首尾字符，避免首尾片段重叠后泄露完整账号
            masked_username="****"
            if [ "${#SWUDK_USERNAME}" -ge 8 ]; then
              masked_username="${SWUDK_USERNAME:0:2}****${SWUDK_USERNAME: -2}"
            fi
            echo "账号: $masked_username"
          else
            echo "⚠️  账号未配置（Secret: ${{ matrix.account.username_secret }}）"
          fi
          echo "========================================="
          echo ""
          
          if [ -z "$SWUDK_USERNAME" ] || [ -z "$SWUDK_PASSWORD" ]; then
            echo "❌ 账号或密码未配置，跳过签到"
            echo "请在 GitHub Secrets 中配置："
            echo "  - ${{ matrix.account.username_secret }}"
            echo "  - ${{ matrix.account.password_secret }}"
            echo "status_code=CONFIG_ERROR" >> "$GITHUB_OUTPUT"
            echo "status_msg=账号或密码未配置" >> "$GITHUB_OUTPUT"
            echo "full_result=账号或密码未配置" >> "$GITHUB_OUTPUT"
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          
          # main() 对签到异常状态返回 1；关闭 errexit，确保仍能读取并解析结果
          set +e
          python -m swu_checkin.check_in > checkin_result.txt 2>&1
          exit_code=$?
          set -e
          
          echo ""
          echo "========================================="
          echo "签到结果"
          echo "========================================="
          cat checkin_result.txt
          echo ""
          
          # 提取返回码和消息
          result_line=$(tail -n 1 checkin_result.txt)
          status_code=PARSE_ERROR
          status_msg="签到结果缺失或格式异常，请查看完整日志"
          if [[ "$result_line" =~ ^\[([0-5])\][[:space:]]+(.*)$ ]]; then
            status_code="${BASH_REMATCH[1]}"
            status_msg="${BASH_REMATCH[2]}"
          fi
          
          echo "status_code=$status_code" >> $GITHUB_OUTPUT
          echo "status_msg=$status_msg" >> $GITHUB_OUTPUT
          echo "full_result=$result_line" >> $GITHUB_OUTPUT
          echo "exit_code=$exit_code" >> $GITHUB_OUTPUT
          
          echo "========================================="
          echo "状态码: $status_code"
          echo "状态信息: $status_msg"
          echo "退出码: $exit_code"
          echo "========================================="
          
          # 1=成功, 2=已签到；其余状态已在脚本内重试，仍失败才告警
          if [ "$exit_code" != "0" ] || { [ "$status_code" != "1" ] && [ "$status_code" != "2" ]; }; then
            echo ""
            echo "⚠️  多次重试后仍异常，准备发送通知邮件"
            exit 1
          fi
          
          echo ""
          echo "✅ 签到正常完成"
        continue-on-error: true

      - name: 格式化执行时间
        id: format_time
        if: always()
        run: |
          echo "beijing_time=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')" >> "$GITHUB_OUTPUT"

      - name: 检查邮件通知配置
        id: mail_config
        if: always() && steps.schedule_guard.outputs.allowed == 'true'
        env:
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          required_vars=(MAIL_SERVER MAIL_PORT MAIL_USERNAME MAIL_PASSWORD NOTIFY_EMAIL)
          missing_vars=()

          for variable_name in "${required_vars[@]}"; do
            variable_value="${!variable_name:-}"
            if [ -z "${variable_value//[[:space:]]/}" ]; then
              missing_vars+=("$variable_name")
            fi
          done

          if [ "${#missing_vars[@]}" -gt 0 ]; then
            missing_text=$(IFS=', '; echo "${missing_vars[*]}")
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "missing=$missing_text" >> "$GITHUB_OUTPUT"
            echo "::warning::邮件通知配置不完整，已跳过发送。缺少: $missing_text"
            echo ""
            echo "⚠️ 邮件通知未发送：配置不完整"
            echo "缺少配置: $missing_text"
            echo "请进入 GitHub 仓库 Settings → Secrets and variables → Actions，补齐以上 Secret。"
            echo "签到结果仍以本次运行的状态码和 Actions 日志为准。"
          else
            # 非空字符串也可能没有有效收件人；不打印或改写邮箱 Secret。
            if python - <<'PY'
          import os
          import re
          from email.utils import getaddresses

          addresses = getaddresses([os.environ["NOTIFY_EMAIL"]])
          valid = bool(addresses) and all(
              re.fullmatch(r"[^@\s,<>]+@[^@\s,<>]+\.[^@\s,<>]+", address)
              for _, address in addresses
          )
          raise SystemExit(0 if valid else 1)
          PY
            then
              echo "configured=true" >> "$GITHUB_OUTPUT"
              echo "missing=" >> "$GITHUB_OUTPUT"
              echo "✅ 邮件通知配置检查通过"
            else
              echo "configured=false" >> "$GITHUB_OUTPUT"
              echo "missing=NOTIFY_EMAIL（收件人格式无效）" >> "$GITHUB_OUTPUT"
              echo "::warning::NOTIFY_EMAIL 没有有效收件人，跳过邮件通知；签到不受影响"
            fi
          fi

      - name: 发送通知邮件
        id: send_mail
        if: always() && steps.schedule_guard.outputs.allowed == 'true' && steps.checkin.outcome != 'success' && steps.mail_config.outputs.configured == 'true'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: '⚠️ SWU 查寝打卡｜${{ matrix.account.name }}｜${{ steps.checkin.outputs.status_msg }}'
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: ${{ secrets.MAIL_USERNAME }}
          body: |
            SWU 查寝打卡

            自动签到异常通知
            ====================

            账号：${{ matrix.account.name }}
            状态码：${{ steps.checkin.outputs.status_code }}
            状态信息：${{ steps.checkin.outputs.status_msg }}
            执行时间：${{ steps.format_time.outputs.beijing_time }} (北京时间)

            本次脚本已完成自动重试。完整结果：
            ${{ steps.checkin.outputs.full_result }}

            状态码说明：
            [0] 今日无签到记录
            [1] 签到成功
            [2] 已签到
            [3] 登录失败，请检查账号密码 Secret
            [4] 网络错误或数据异常
            [5] 请假期间无需签到
            [CONFIG_ERROR] 运行配置不完整

            查看 Actions 日志：
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          html_body: |
            <!doctype html>
            <html lang="zh-CN">
            <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>SWU 查寝打卡异常通知</title>
            </head>
            <body style="margin:0;padding:0;background:#f8fafc;color:#475569;font-family:'Segoe UI','Microsoft YaHei',Arial,sans-serif;">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f8fafc;margin:0;padding:32px 12px;">
                <tr>
                  <td align="center">
                    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:620px;border-collapse:collapse;">
                      <tr>
                        <td style="padding:0 4px 16px;text-align:left;">
                          <span style="color:#0f172a;font-size:18px;font-weight:700;">SWU 查寝打卡</span>
                        </td>
                      </tr>
                      <tr>
                        <td style="border:1px solid #e2e8f0;border-radius:10px;background:#ffffff;padding:32px 28px;">
                          <div style="color:#2563eb;font-size:11px;line-height:1.4;font-weight:700;letter-spacing:1.2px;margin-bottom:10px;">自动签到通知</div>
                          <h1 style="margin:0;color:#0f172a;font-size:23px;line-height:1.4;font-weight:700;">签到任务需要关注</h1>
                          <div style="height:2px;width:40px;background:#2563eb;margin:18px 0 22px;"></div>

                          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="border-collapse:collapse;margin-bottom:22px;">
                            <tr>
                              <td style="padding:0 0 12px;color:#64748b;font-size:13px;width:92px;">账号</td>
                              <td style="padding:0 0 12px;color:#0f172a;font-size:14px;font-weight:600;">${{ matrix.account.name }}</td>
                            </tr>
                            <tr>
                              <td style="padding:0 0 12px;color:#64748b;font-size:13px;">状态码</td>
                              <td style="padding:0 0 12px;color:#0f172a;font-size:14px;font-weight:600;">${{ steps.checkin.outputs.status_code }}</td>
                            </tr>
                            <tr>
                              <td style="padding:0;color:#64748b;font-size:13px;">状态信息</td>
                              <td style="padding:0;color:#0f172a;font-size:14px;font-weight:600;">${{ steps.checkin.outputs.status_msg }}</td>
                            </tr>
                          </table>

                          <div style="padding:16px;border-radius:8px;background:#eff6ff;border:1px solid #dbeafe;color:#1e3a8a;font-size:14px;line-height:1.75;">
                              脚本已完成自动重试。详细日志请点击下方按钮查看。
                          </div>

                          <div style="margin-top:24px;text-align:center;">
                            <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" style="display:inline-block;padding:11px 18px;border-radius:7px;background:#2563eb;color:#ffffff;text-decoration:none;font-size:14px;font-weight:700;">查看 Actions 日志</a>
                          </div>
                        </td>
                      </tr>
                      <tr>
                        <td style="padding:20px 4px 0;text-align:center;color:#64748b;font-size:13px;line-height:1.7;">
                          <div>此邮件由 SWU 查寝打卡自动发送</div>
                          <div>如果任务已经恢复正常，可以忽略本邮件。</div>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
            </body>
            </html>

      - name: 邮件通知结果
        if: always() && steps.schedule_guard.outputs.allowed == 'true' && steps.checkin.outcome != 'success'
        run: |
          if [ "${{ steps.mail_config.outputs.configured }}" != "true" ]; then
            echo "⚠️ 邮件通知未发送：邮件配置不完整"
            echo "缺少配置: ${{ steps.mail_config.outputs.missing }}"
          elif [ "${{ steps.send_mail.outcome }}" != "success" ]; then
            echo "⚠️ 邮件通知发送失败：请检查 SMTP 服务器、端口、邮箱账号和授权码"
            echo "签到结果不受邮件发送失败影响，详细 SMTP 错误请查看上一步日志"
          else
            echo "✅ 异常通知邮件已发送"
          fi

      - name: 最终状态检查
        if: always()
        env:
          ALLOWED: ${{ steps.schedule_guard.outputs.allowed }}
          STATUS_CODE: ${{ steps.checkin.outputs.status_code }}
          STATUS_MSG: ${{ steps.checkin.outputs.status_msg }}
          CHECKIN_EXIT_CODE: ${{ steps.checkin.outputs.exit_code }}
          CHECKIN_OUTCOME: ${{ steps.checkin.outcome }}
        run: |
          echo ""
          echo "========================================="
          echo "任务执行完成 - ${{ matrix.account.name }}"
          echo "========================================="
          echo "状态码: $STATUS_CODE"
          echo "状态信息: $STATUS_MSG"
          if [ "$ALLOWED" = "false" ]; then
            echo "⏭️ 已跳过旧定时任务或窗口外执行；本次未提交签到"
            exit 0
          fi
          {
            echo "### 签到结果 - ${{ matrix.account.name }}"
            echo "- 状态码: ${STATUS_CODE:-未取得结果}"
            echo "- 状态信息: ${STATUS_MSG:-请查看安装依赖和签到步骤日志}"
            echo "- 签到进程退出码: ${CHECKIN_EXIT_CODE:-未执行}"
            echo "- 邮件通知结果: ${{ steps.send_mail.outcome }}（独立于签到结果）"
          } >> "$GITHUB_STEP_SUMMARY"
          
          if [ "$CHECKIN_OUTCOME" = "success" ] && [ "$CHECKIN_EXIT_CODE" = "0" ] && [ "$STATUS_CODE" = "1" ]; then
            echo "✅ 签到成功"
          elif [ "$CHECKIN_OUTCOME" = "success" ] && [ "$CHECKIN_EXIT_CODE" = "0" ] && [ "$STATUS_CODE" = "2" ]; then
            echo "✅ 已签到，无需重复"
          else
            echo "⚠️ 签到任务异常"
            if [ "${{ steps.mail_config.outputs.configured }}" = "true" ] && [ "${{ steps.send_mail.outcome }}" = "success" ]; then
              echo "✅ 异常通知邮件已发送"
            elif [ "${{ steps.mail_config.outputs.configured }}" != "true" ]; then
              echo "⚠️ 邮件通知未发送：配置不完整"
            else
              echo "⚠️ 邮件通知发送失败，请检查 SMTP 配置"
            fi
            echo "❌ 本次签到未确认成功，Actions 必须标记失败"
            exit 1
          fi
          echo "========================================="
